const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const rnd=v=>{const k=Math.pow(10,db.pdec??2);return Math.round((v+Number.EPSILON)*k)/k};

const pent=(m,id)=>((db.pay||{})[m]||{})[id]||{};

const lvT=()=>(db.lvTypes||[]).map(l=>{const[n,p]=l.split('|').map(x=>x.trim());return{name:n,pct:Math.min(100,Math.max(0,p===undefined||p===''?0:num(p)))}}).filter(x=>x.name);
const dIM=m=>{const[y,n]=m.split('-').map(Number);return new Date(y,n,0).getDate()};
function daysIn(l,from,to){const a=Math.max(+new Date(l.from+'T00:00'),+new Date(from+'T00:00')),b=Math.min(+new Date((l.to||l.from)+'T00:00'),+new Date(to+'T00:00')),off=OFFD[db.lvOff||'none']||[];let c=0;for(let d=new Date(a);+d<=b;d.setDate(d.getDate()+1))if(!off.includes(d.getDay()))c++;return c}
const monthDays=(l,m)=>daysIn(l,m+'-01',m+'-'+String(dIM(m)).padStart(2,'0'));
function dailyRate(s,m){const base=num(s.basic)+(db.lvBase==='all'?num(s.allow):0),basis=db.lvDays==='cal'?dIM(m):(num(db.lvDays)||30);return base/basis}
function calc(s,m){const e=pent(m,s.id),basic=num(s.basic),allow=num(s.allow),bonus=num(e.bonus),ded=num(s.ded),extra=num(e.extra),isCash=s.pay==='Cash';
 const its=(db.pitems||[]).map(it=>({it,amt:num(it.mode==='fixed'?s['p_'+it.id]:e['i_'+it.id])})).filter(x=>x.amt>0);
 const sum=(k,p)=>its.filter(x=>x.it.kind===k&&x.it.pay===p).reduce((a,x)=>a+x.amt,0);
 const daily=dailyRate(s,m),lm={};(db.leaves||[]).filter(l=>FT('leaves')&&l.sid===s.id).forEach(l=>{const d=monthDays(l,m);if(d)lm[l.type]=(lm[l.type]||0)+d});
 const lv=Object.entries(lm).map(([name,days])=>{const t=lvT().find(x=>x.name===name),pct=t?t.pct:0;return{name,days,pct,amt:rnd(days*daily*(1-pct/100))}});
 const lvAmt=lv.reduce((a,x)=>a+x.amt,0);
 const dets=(FT('dets')?(e.dets||[]):[]).map(d=>({r:d.r,a:num(d.a),via:d.via==='cash'?'cash':'bank'})).filter(d=>d.a>0);
 const detB=dets.filter(d=>d.via==='bank').reduce((a,d)=>a+d.a,0),detC=dets.filter(d=>d.via==='cash').reduce((a,d)=>a+d.a,0);
 const earnB=sum('earn','bank'),earnC=sum('earn','cash'),dedB=sum('ded','bank'),dedC=sum('ded','cash');
 const gross=rnd(basic+allow+bonus+earnB+earnC),dtot=rnd(ded+extra+dedB+dedC+lvAmt+detB+detC),net=rnd(gross-dtot);
 const bankGross=isCash?0:basic+earnB,cashGross=gross-bankGross;
 let bk=bankGross-(ded+extra+dedB+lvAmt+detB),ch=cashGross-dedC-detC;if(bk<0){ch+=bk;bk=0}if(ch<0){bk+=ch;ch=0}
 const bank=rnd(Math.max(0,bk)),cash=rnd(Math.max(0,ch)),fee=feeFor(s,bank);
 return{basic,allow,bonus,ded,extra,its,lv,lvAmt:rnd(lvAmt),dets,daily,gross,dtot,net,bank,cash,fee,pay:rnd(bank+cash),cost:rnd(bank+cash+fee),paid:!!e.paid,has:basic+allow+earnB+earnC>0}}

/* ===== LOCAL ACCOUNTS, LOGIN SCREEN AND GUEST FILE MODE =====
   Two ways in (login screen): Local login (email + password) and Guest files (no account, nothing saved).
   - Accounts live in this browser/app profile only (key "users"); they are not part of backups.
   - Passwords are never stored. Each one becomes a salted PBKDF2-SHA256 hash (600,000 rounds, WebCrypto, works offline).
   - The first account is the administrator. Further accounts are added by an administrator (Settings > Local accounts).
   - This controls who can open the app on THIS device. It does not encrypt the data stored on the device.
   - Guest mode works on a throw-away copy of the data in memory: nothing is written to storage. */

  return (neg?'-':'') + String(i).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + fr;
}
const pad3 = n => String(n).padStart(3,'0');
const fils = x => Math.round(x*1000);
function dispDate(k){ return k.slice(8)+'/'+k.slice(5,7)+'/'+k.slice(0,4); }
function longDate(k){ return +k.slice(8)+' '+MON[+k.slice(5,7)-1]+' '+k.slice(0,4); }
function shortDate(k){ return +k.slice(8)+' '+MON[+k.slice(5,7)-1]; }
function serial(k){ return Math.round((Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8))-Date.UTC(1899,11,30))/864e5); }
function toKey(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') { if (v<20000) return null; const d=new Date(Math.round((v-25569)*864e5)); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if (m) return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
function num(v){ if (typeof v==='number') return v; if (v==null) return 0; const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; }

/* ---------- zip / xlsx reading (no libraries) ---------- */
async function inflateRaw(bytes){
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = -1;
  for (let i=u8.length-22; i>=Math.max(0,u8.length-70000); i--) if (dv.getUint32(i,true)===0x06054b50){ e=i; break; }
  if (e<0) throw new Error('Not a valid .xlsx file.');
  const n = dv.getUint16(e+10,true); let p = dv.getUint32(e+16,true);
  const out = {}, td = new TextDecoder();
  for (let i=0;i<n;i++){
    if (dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csz=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name = td.decode(u8.subarray(p+46,p+46+nl));
    p += 46+nl+el+cl;
    if (!/^(xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|worksheets\/[^/]+\.xml))$/.test(name)) continue;
    const lnl=dv.getUint16(off+26,true), lel=dv.getUint16(off+28,true), ds=off+30+lnl+lel;
    const raw = u8.subarray(ds, ds+csz);
    out[name] = td.decode(method===0 ? raw : await inflateRaw(raw));
  }
  return out;
}
function colIdx(ref){ let n=0; for (const ch of ref.match(/^[A-Z]+/)[0]) n = n*26 + ch.charCodeAt(0)-64; return n-1; }
function parseXml(s){ const d=new DOMParser().parseFromString(s,'application/xml'); if (d.getElementsByTagName('parsererror').length) throw new Error('Could not read the spreadsheet XML.'); return d; }
async function readXlsx(buf){
  const files = await unzip(buf);
  let sst = [];
  if (files['xl/sharedStrings.xml']){
    sst = [...parseXml(files['xl/sharedStrings.xml']).getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  }
  let path = 'xl/worksheets/sheet1.xml';
  try {
    const wb = parseXml(files['xl/workbook.xml']), rel = parseXml(files['xl/_rels/workbook.xml.rels']);
    const sh = wb.getElementsByTagName('sheet')[0];
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    for (const r of rel.getElementsByTagName('Relationship')) if (r.getAttribute('Id')===rid){ let t=r.getAttribute('Target'); t = t.startsWith('/') ? t.slice(1) : 'xl/'+t; path=t; }
  } catch(_){}
  if (!files[path]) { const k = Object.keys(files).find(k=>k.startsWith('xl/worksheets/')); if (!k) throw new Error('No worksheet found in the file.'); path=k; }
  const doc = parseXml(files[path]), rows = [];
  for (const r of doc.getElementsByTagName('row')){
    const arr = [];
    for (const c of r.getElementsByTagName('c')){
      const t = c.getAttribute('t'), ci = colIdx(c.getAttribute('r'));
      let v = null;
      if (t==='inlineStr') v = [...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else { const ve = c.getElementsByTagName('v')[0]; if (ve){ const tx=ve.textContent; v = t==='s' ? sst[+tx] : (t==='str'||t==='e') ? tx : t==='b' ? tx==='1' : parseFloat(tx); } }
      arr[ci] = v;
    }
    rows.push(arr);
  }
  return rows;
}
function readCsv(text){
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if (ch==='"') q=true;
    else if (ch===','){ row.push(cur); cur=''; }
    else if (ch==='\n'||ch==='\r'){ if (ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; rows.push(row); row=[]; }
    else cur+=ch;
  }
  if (cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.map(r=>r.map(v=>{ if (v!=='' && !isNaN(v) && /^-?[\d.]+$/.test(v.trim())) return parseFloat(v); return v; }));
}

/* ---------- statement parsing ---------- */
function classify(desc){
  const first = desc.split(/\r?\n/)[0].trim().toLowerCase();
  let kind = 'other', term = null;
  if (first.startsWith('merchant settlement')) kind='settle';
  else if (first.startsWith('pos payment')) kind='pospay';
  else if (first.startsWith('pos commission')) kind='comm';
  else if (first.startsWith('pos rental fee')) kind='rental';
  else if (first==='system') kind='sys';
  if (kind!=='other'){
    const m = desc.match(/term\s*(\d{6,})/i) || desc.match(/Terminal\s*(\d{6,})/i) || desc.match(/\n\s*(\d{8})\s/);
    term = m ? m[1] : null;
    if (!term) kind = 'other';
  }
  return {kind, term, type:first};
}
function parseStatement(rows){
  let h=-1, col={};
  const meta = {name:'',account:'',declared:null};
  const nextVal = (r,i)=>{ for (let j=i+1;j<r.length;j++) if (r[j]!=null && String(r[j]).trim()!=='') return r[j]; return null; };
  for (let i=0;i<Math.min(rows.length,40);i++){
    const r = rows[i]||[], lc = r.map(v=>String(v==null?'':v).trim().toLowerCase());
    if (lc.includes('date') && lc.includes('debit') && lc.includes('credit')){ h=i; lc.forEach((v,j)=>{ if(['date','description','debit','credit','balance'].includes(v)) col[v]=j; }); break; }
    lc.forEach((v,j)=>{
      if (v.startsWith('name')) meta.name = String(nextVal(r,j)||'').trim();
      else if (v.startsWith('account')) meta.account = String(nextVal(r,j)||'').trim();
      else if (v.startsWith('no. of transactions')) meta.declared = num(nextVal(r,j));
    });
  }
  if (h<0 || col.description==null) throw new Error('Could not find the Date / Description / Debit / Credit / Balance columns in this file.');
  const tx = []; let breaks = 0, prev = null;
  for (let i=h+1;i<rows.length;i++){
    const r = rows[i]; if (!r) continue;
    const key = toKey(r[col.date]); if (!key) continue;
    const desc = String(r[col.description]==null?'':r[col.description]);
    const deb = fils(num(r[col.debit])), cr = fils(num(r[col.credit])), bal = col.balance!=null ? fils(num(r[col.balance])) : null;
    if (prev!=null && bal!=null && prev + cr - deb !== bal) breaks++;
    prev = bal;
    tx.push({key, desc, deb, cr, bal, ...classify(desc)});
  }
  if (!tx.length) throw new Error('No transactions were found in this file.');
  let min=tx[0].key, max=tx[0].key; for (const t of tx){ if(t.key<min)min=t.key; if(t.key>max)max=t.key; }
  return {meta, tx, min, max, breaks, hasBal: col.balance!=null};
}

async function loadFile(f){
  $('#tr_fileMsg').innerHTML = '<div class="msg ok">Reading '+esc(f.name)+'…</div>';
  try {
    const buf = await f.arrayBuffer(), u = new Uint8Array(buf);
    let rows;
    if (u[0]===0x50 && u[1]===0x4B) rows = await readXlsx(buf);
    else if (u[0]===0xD0 && u[1]===0xCF) throw new Error('This is the old binary .xls format. Open it in Excel, Save As .xlsx (or .csv), then upload that.');

/* ---------- cycles ---------- */
function buildCycles(){
  const out = [], [y0,m0] = [+data.min.slice(0,4), +data.min.slice(5,7)], [y1,m1] = [+data.max.slice(0,4), +data.max.slice(5,7)];
  let y=y0, m=m0-1; if (m<1){ m=12; y--; }
  while (y<y1 || (y===y1 && m<=m1)){
    const start = y+'-'+pad(m)+'-02';
    let ny=y, nm=m+1; if (nm>12){ nm=1; ny++; }
    const end = ny+'-'+pad(nm)+'-01';
    if (end>=data.min && start<=data.max){
      const full = data.min<=start && data.max>=end;
      out.push({start,end,full,label: shortDate(start)+' – '+longDate(end)});
    }
    m++; if (m>12){ m=1; y++; }
  }
  return out;
}
let cycles = [];
function afterLoad(){
  const d = data, m = d.meta, chips = [];
  chips.push('<span class="chip">'+esc(m.account||'Account')+'</span>');
  if (m.name) chips.push('<span class="chip">'+esc(m.name)+'</span>');
  chips.push('<span class="chip">'+d.tx.length.toLocaleString()+' transactions</span>');
  chips.push('<span class="chip">'+longDate(d.min)+' – '+longDate(d.max)+'</span>');
  if (m.declared!=null && m.declared!==d.tx.length) chips.push('<span class="chip bad">Header says '+m.declared+' transactions</span>');
  else if (m.declared!=null) chips.push('<span class="chip ok">Count matches header</span>');
  if (d.hasBal) chips.push(d.breaks ? '<span class="chip bad">'+d.breaks+' running-balance breaks</span>' : '<span class="chip ok">Running balance continuous</span>');
  $('#tr_chips').innerHTML = chips.join('');
  cycles = buildCycles();
  const sel = $('#tr_preset');
  sel.innerHTML = cycles.map((c,i)=>'<option value="'+i+'">'+esc(c.label)+(c.full?'':' (partial data)')+'</option>').join('') +
    '<option value="all">Whole statement ('+dispDate(d.min)+' – '+dispDate(d.max)+')</option><option value="custom">Custom dates</option>';
  let idx = -1; cycles.forEach((c,i)=>{ if (c.full) idx=i; });
  if (idx<0) idx = cycles.length-1;
  if (idx>=0){ sel.value = String(idx); setPeriod(cycles[idx].start, cycles[idx].end); }
  else { sel.value='all'; setPeriod(d.min,d.max); }
  $('#tr_periodCard').hidden = false; $('#tr_resCard').hidden = false;
}

function setPeriod(from,to,fromInputs){

}

/* ---------- compute ---------- */
function compute(){
  const {from,to} = period, res = {terms:new Map(), other:{cr:0,deb:0,n:0,types:new Map()}, cr:0, deb:0, n:0, open:null, close:null, rows:[]};
  if (!from || !to || from>to){ result = null; return; }
  for (const t of data.tx){
    if (t.key<from || t.key>to) continue;
    res.n++; res.cr+=t.cr; res.deb+=t.deb;
    if (res.open==null && t.bal!=null) res.open = t.bal - t.cr + t.deb;
    if (t.bal!=null) res.close = t.bal;
    if (t.term){
      let a = res.terms.get(t.term);
      if (!a){ a = {cr:0,deb:0,n:0,settle:0,pospay:0,comm:0,rental:0,sys:0,rows:[]}; res.terms.set(t.term,a); }
      a.cr+=t.cr; a.deb+=t.deb; a.n++; a.rows.push(t);
      if (t.kind==='settle') a.settle+=t.cr; else if (t.kind==='pospay') a.pospay+=t.cr;
      else if (t.kind==='comm') a.comm+=t.deb; else if (t.kind==='rental') a.rental+=t.deb; else if (t.kind==='sys') a.sys+=t.deb;
    } else {
      const o = res.other; o.cr+=t.cr; o.deb+=t.deb; o.n++;
      const k = t.type.replace(/\d+/g,'#').trim() || '(blank)';
      let g = o.types.get(k); if (!g){ g={cr:0,deb:0,n:0}; o.types.set(k,g); } g.cr+=t.cr; g.deb+=t.deb; g.n++;
    }
  }
  result = res;
}

  let tc=0, td=0, tn=0;

    tc+=a.cr; td+=a.deb; tn+=a.n;

    return '<tr class="'+(a.n?'t':'t zero')+(unassigned?' unassigned':'')+'" data-t="'+t+'"><td>'+bc+'</td><td class="ro">'+t+'</td><td>'+fmt(a.cr)+'</td><td>'+fmt(a.deb)+'</td><td>'+fmt(a.cr-a.deb)+'</td><td>'+a.n+'</td>'+
      (det?'<td>'+fmt(a.settle)+'</td><td>'+fmt(a.pospay)+'</td><td>'+fmt(a.comm)+'</td><td>'+fmt(a.rental)+'</td><td>'+fmt(other)+'</td>':'')+'</tr>';
  };
  for (const x of map) h += line(x.t, x.b, result.terms.get(x.t), false);
  for (const t of extra) h += line(t, '', result.terms.get(t), true);
  h += '<tr class="total"><td>Total terminals</td><td></td><td>'+fmt(tc)+'</td><td>'+fmt(td)+'</td><td>'+fmt(tc-td)+'</td><td>'+tn+'</td>'+(det?'<td colspan="5"></td>':'')+'</tr>';
  h += '</tbody>';
  tbl.innerHTML = h;
  // reconciliation block
  const o = result.other;
  let r = '<div class="tw" style="margin-top:14px"><table><thead><tr><th>Reconciliation</th><th></th><th>Credit</th><th>Debit</th><th>Net</th><th>Txns</th></tr></thead><tbody>';
  r += '<tr class="sub"><td>Not terminal-related (cheques, transfers, cash, bank fees)</td><td></td><td>'+fmt(o.cr)+'</td><td>'+fmt(o.deb)+'</td><td>'+fmt(o.cr-o.deb)+'</td><td>'+o.n+'</td></tr>';
  r += '<tr class="total"><td>Statement total for period</td><td></td><td>'+fmt(result.cr)+'</td><td>'+fmt(result.deb)+'</td><td>'+fmt(result.cr-result.deb)+'</td><td>'+result.n+'</td></tr></tbody></table></div>';
  const ties = (tc+o.cr===result.cr) && (td+o.deb===result.deb);
  r += '<div class="msg '+(ties?'ok':'bad')+'">'+(ties?'Terminals + other items = statement total.':'Terminal and other items do not add up to the statement total.')+'</div>';
  if (result.open!=null){
    const ok = result.open + result.cr - result.deb === result.close;
    r += '<div class="msg '+(ok?'ok':'bad')+'">Balance: opening '+fmt(result.open)+' + credits '+fmt(result.cr)+' − debits '+fmt(result.deb)+' = '+fmt(result.open+result.cr-result.deb)+(ok?' = closing '+fmt(result.close)+' ✓':' ≠ closing '+fmt(result.close)+' ✗')+'</div>';
  }
  if (o.n){
    r += '<details><summary>Not terminal-related: '+o.n+' items</summary><div class="tw"><table><thead><tr><th>Type</th><th></th><th>Credit</th><th>Debit</th><th></th><th>Txns</th></tr></thead><tbody>';
    for (const [k,g] of [...o.types.entries()].sort((a,b)=>(b[1].deb+b[1].cr)-(a[1].deb+a[1].cr))) r += '<tr class="sub"><td>'+esc(k)+'</td><td></td><td>'+fmt(g.cr)+'</td><td>'+fmt(g.deb)+'</td><td></td><td>'+g.n+'</td></tr>';

  }

}

const _fput0=fput0,_fdel0=fdel0,_fclear0=fclear0;
fput0=async(id,b)=>{const r=await _fput0(id,b);if(r&&cfg()){st.fdirty.includes(id)||st.fdirty.push(id);st.fdel=st.fdel.filter(x=>x!==id);saveSt();kick()}return r};
fdel0=async id=>{await _fdel0(id);if(cfg()){st.fdel.includes(id)||st.fdel.push(id);st.fdirty=st.fdirty.filter(x=>x!==id);saveSt();kick()}};
fclear0=async()=>{if(cfg()){for(const id of await fkeys())st.fdel.includes(id)||st.fdel.push(id);st.fdirty=[];saveSt()}await _fclear0()};
function setMsg(t){msg=t;paint()}
function paint(){let b=document.getElementById('syst');
 if(!b){const rl=document.getElementById('rl');if(!rl)return;b=document.createElement('button');b.id='syst';b.type='button';b.className='btn sm';b.style.cssText='background:rgba(255,255,255,.22);color:inherit;margin-left:6px';b.onclick=()=>cfg()?now():connect();rl.after(b)}
 const c=cfg(),t=!c?'Sync off':state==='busy'?(msg||'Syncing...'):state==='err'?'Offline: changes saved here':'Synced '+new Date(lastOk).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 b.textContent=t;b.title=c?(errTxt||'Click to sync now'):'Click to connect to the server';
 const sc=document.getElementById('sysc');if(sc)sc.textContent=c?t+(errTxt&&state==='err'?' ('+errTxt+')':''):'Not connected'}
async function now(){if(busy||!cfg())return;busy=true;state='busy';msg='Syncing...';paint();
 try{if(!busyUI())await pull();await push();await files();if(touched&&!busyUI())applyUI();state='ok';errTxt='';lastOk=Date.now()}
 catch(e){state='err';errTxt=e.auth?'Access key refused. Reconnect.':(e.message==='Failed to fetch'?'No connection':e.message)}
 busy=false;paint()}
function kick(){if(!cfg())return;clearTimeout(timer);timer=setTimeout(now,1500)}
function connect(){const f=$('#frm'),dflt=cfg()?url():/^https?:/.test(location.protocol)&&!['127.0.0.1','localhost'].includes(location.hostname)?location.origin:'';
 f.innerHTML=`<h2>Connect to the sync server</h2><div class="full meta">Enter the server address and the access key set on the server (the ACCESS_KEY variable). Data on this device is kept and merged with the server copy.</div><label class="full">Server address<input id="sy_u" value="${esc(dflt)}" placeholder="https://your-app.up.railway.app" autocomplete="off"></label><label class="full">Access key<input id="sy_k" type="password" autocomplete="off"></label><div class="full meta" id="sy_e" style="color:var(--bad)"></div><div class="fbar"><button class="btn alt" type="button" id="sy_c">Cancel</button><button class="btn" type="submit">Connect</button></div>`;
 f.onsubmit=async e=>{e.preventDefault();const u=$('#sy_u').value.trim().replace(/\/+$/,''),k=$('#sy_k').value;
  try{if(!/^https?:\/\//i.test(u))throw new Error('Start the address with https://');
   const p=await fetch(u+'/api/ping',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);if(!p||p.app!=='branch-ops-sync')throw new Error('That address is not a Branch Ops server.');
   if(!p.configured)throw new Error('The server has no ACCESS_KEY variable yet.');
   const r=await fetch(u+'/api/auth',{headers:{'X-Access-Key':k},cache:'no-store'});if(r.status===401)throw new Error('Wrong access key.');if(r.status===429)throw new Error('Too many wrong keys. Wait 10 minutes.');if(!r.ok)throw new Error('Server said '+r.status);
   if(!cfg()||url()!==u){st=fresh();saveSt()}
   saveCfg({url:u,key:k});$('#dlg').close();start();now()}catch(er){$('#sy_e').textContent=er.message||String(er)}};
 $('#sy_c').onclick=()=>$('#dlg').close();$('#dlg').showModal();$('#sy_k').focus()}
function off(){if(!confirm('Disconnect from the server? Data on this device stays. It stops syncing.'))return;saveCfg(null);st=fresh();saveSt();state='off';paint();if(tab==='set')render()}
let iv=null;
function start(){paint();if(iv)return;iv=setInterval(()=>{if(!document.hidden)now()},8000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)now()});window.addEventListener('online',now)}
function card(){const c=cfg();return `<div class="card"><h3 style="margin:0 0 6px">Sync between devices</h3><div class="meta">Keeps this device and your other devices (PC, phone) the same through the Branch Ops server. The app keeps working offline and sends changes when the connection returns. If two devices change the same record at the same moment, the later save wins for that record.</div><div class="meta" style="margin:8px 0">Status: <b id="sysc">${c?'checking...':'Not connected'}</b>${c?'<br>Server: '+esc(c.url):''}</div><div class="acts">${c?'<button class="btn" type="button" onclick="SY.now()">Sync now</button><button class="btn alt" type="button" onclick="SY.connect()">Change server or key</button><button class="btn alt" type="button" onclick="SY.off()">Disconnect</button>':'<button class="btn" type="button" onclick="SY.connect()">Connect to server</button>'}</div></div>`}
async function boot(){paint();if(cfg()){start();setTimeout(now,500);return}
 if(/^https?:/.test(location.protocol)&&!['127.0.0.1','localhost'].includes(location.hostname)){try{const p=await fetch('/api/ping',{cache:'no-store'}).then(r=>r.json());if(p&&p.app==='branch-ops-sync'&&!sessionStorage.getItem('sy_asked')){sessionStorage.setItem('sy_asked','1');connect()}}catch(e){}}}
window.SYKICK=kick;
return{boot,now,connect,off,card,merge3}})();
['lic','ast','veh','docs','stf','rec','upl','set'].forEach(t=>$('#t-'+t).onclick=()=>go(t));
enter();render();countUp();
loadLogo();
uplInit();
showLock();resetIdle();
authStart();
SY.boot();
</script>
</body>
</html>
